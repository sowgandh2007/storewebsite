name: Deploy Storefront to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3
    
    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: store website/    # Deploy ONLY the storefront files
        server-dir: avadhanulastores.shop/htdocs/           # Upload to public htdocs directory for the custom domain
        state-name: .ftp-deploy-state # Keeps track of uploaded files to speed up deployments
