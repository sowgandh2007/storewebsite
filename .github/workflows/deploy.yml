name: Deploy Storefront to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP to avadhanulastores.shop
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: "./store website/"
          server-dir: avadhanulastores.shop/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tailwind-input.css
          state-name: .ftp-deploy-state
          log-level: verbose
